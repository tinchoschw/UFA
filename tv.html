<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pantalla</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap"><link rel="stylesheet" href="estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
html,body{height:100%;overflow:hidden;background:#000}
.scr{position:fixed;inset:0;display:none;align-items:center;justify-content:center;text-align:center}
.scr.on{display:flex}
#s-wait{gap:6vw;padding:0 5vw}#s-wait .t{font-size:3vw;color:var(--mut)}
#code{font:11vw/1 "Bowlby One",Impact,sans-serif;color:var(--pk);letter-spacing:.04em;margin-top:2vw}
#qr{background:#fff;padding:1.2vw;border-radius:1vw;width:26vw;height:26vw;flex:none}#qr svg{width:100%;height:100%;display:block}
#s-busy{flex-direction:column;gap:3vw}.pk{font-size:16vw;animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12) rotate(-4deg)}}
@media(prefers-reduced-motion:reduce){.pk{animation:none}}
#s-busy .t{font:5vw "Bowlby One",Impact,sans-serif;color:var(--pk)}
#s-show{flex-direction:column;gap:2vh}#pic{height:80vh;aspect-ratio:1;border-radius:2vw;box-shadow:0 0 6vw #ff7a1a66}
#barw{width:50vw;height:1.2vh;background:#2a1a40;border-radius:9px;overflow:hidden}#bar{height:100%;width:100%;background:var(--pk)}
#off{border:0;width:100%;height:100%;background:#000}
#s-login{flex-direction:column;gap:12px;padding:20px}#s-login>*{max-width:360px;width:100%}
</style></head><body>
<div class="scr" id="s-login"><h1>Pantalla TV</h1><input type="email" id="em" placeholder="Email" autocomplete="username"><input type="password" id="pw" placeholder="Contraseña" autocomplete="current-password"><button id="li">Entrar</button><div class="err" id="le"></div></div>
<div class="scr" id="s-off"><iframe id="off" title="Visuales"></iframe></div>
<div class="scr" id="s-wait"><div><div class="t">Escaneá el QR y escribí este código</div><div id="code">000 000</div></div><div id="qr"></div></div>
<div class="scr" id="s-busy"><div class="pk">🎃</div><div class="t">Halloweeneando una foto…</div></div>
<div class="scr" id="s-show"><img id="pic" alt="Foto Halloween"><div id="barw"><div id="bar"></div></div></div>
<script type="module">
import {auth,db,refs,watchCfg,onAuthStateChanged,signInWithEmailAndPassword,onSnapshot,updateDoc,writeBatch} from './fb.js';
const $=s=>document.querySelector(s);
let cfg=null,st=null,code='',lockT=null,showT=null,wasOn=false,started=false;
const scr=id=>document.querySelectorAll('.scr').forEach(e=>e.classList.toggle('on',e.id===id));
const rnd=()=>String(Math.floor(Math.random()*1e6)).padStart(6,'0');
async function resetWait(){const b=writeBatch(db);b.set(refs.state,{phase:'wait',img:null,lockedBy:null});b.set(refs.secret,{code:rnd()});await b.commit()}
$('#li').onclick=()=>signInWithEmailAndPassword(auth,$('#em').value.trim(),$('#pw').value).catch(()=>{$('#le').textContent='Email o contraseña incorrectos.'});
onAuthStateChanged(auth,u=>{if(u&&!u.isAnonymous){if(!started){started=true;go()}}else scr('s-login')});
function go(){
  document.body.style.cursor='none';
  try{const q=qrcode(0,'M');q.addData(new URL('celu.html',location.href).href);q.make();$('#qr').innerHTML=q.createSvgTag({cellSize:4,margin:0})}catch(e){}
  watchCfg(c=>{cfg=c;if(c.enabled&&!wasOn)resetWait();wasOn=c.enabled;coordinate();render()});
  onSnapshot(refs.state,s=>{st=s.exists()?s.data():null;coordinate();render()});
  onSnapshot(refs.secret,s=>{code=s.exists()?s.data().code:'';render()});
}
function coordinate(){
  if(!cfg||!cfg.enabled){clearTimeout(lockT);clearTimeout(showT);lockT=showT=null;return}
  if(!st)return;
  const p=st.phase;
  if(p!=='locked'&&lockT){clearTimeout(lockT);lockT=null}
  if(p!=='show'&&showT){clearTimeout(showT);showT=null}
  if(p==='locked'&&!lockT)lockT=setTimeout(()=>{lockT=null;resetWait()},cfg.lockSecs*1000);
  if(p==='ready'&&!cfg.manual)updateDoc(refs.state,{phase:'show'});
  if(p==='cancel')resetWait();
  if(p==='show'&&!showT){
    const b=$('#bar');b.style.transition='none';b.style.width='100%';void b.offsetWidth;b.style.transition='width '+cfg.showSecs+'s linear';b.style.width='0%';
    showT=setTimeout(()=>{showT=null;resetWait()},cfg.showSecs*1000);
  }
}
function render(){
  if(!cfg)return;
  if(!cfg.enabled){const f=$('#off');if(f.dataset.u!==cfg.offUrl){f.dataset.u=cfg.offUrl;if(cfg.offUrl)f.src=cfg.offUrl;else f.removeAttribute('src')}scr('s-off');return}
  if(!st){scr('s-busy');return}
  if(st.phase==='wait'){$('#code').textContent=code.slice(0,3)+' '+code.slice(3);scr('s-wait')}
  else if(st.phase==='show'&&st.img){$('#pic').src=st.img;scr('s-show')}
  else scr('s-busy');
}
</script></body></html>
