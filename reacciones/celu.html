<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Reaccioná en vivo</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap"><link rel="stylesheet" href="estilo.css">
<style>
main{max-width:440px;margin:0 auto;padding:18px}
#f{display:flex;flex-direction:column;gap:12px}.q{font-size:14px}.q small{color:var(--mut)}
.g{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.g button{font-size:46px;line-height:1;padding:16px 0;background:var(--panel);border:2px solid var(--line);border-radius:16px}
.g button[aria-pressed=true]{border-color:var(--pk);box-shadow:0 0 0 2px var(--pk2),0 0 18px #ff2bd677}
#prev{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;display:none}#prev[src]{display:block}
.sr{position:absolute;opacity:0;width:1px;height:1px;overflow:hidden}
#pick{display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px;border:2px dashed var(--pk);border-radius:16px;background:var(--panel);color:var(--ink);font-weight:600;cursor:pointer}
#pick svg{width:96px;height:auto;color:var(--pk)}
#pick .a{fill:var(--panel);stroke:currentColor;stroke-width:4}#pick .b{fill:var(--bg);stroke:currentColor;stroke-width:4}#pick .o{fill:currentColor}#pick .m{fill:var(--pk2)}
#file:focus-visible+#pick{outline:2px solid var(--ink);outline-offset:2px}
#pickw{display:flex;flex-direction:column;gap:10px}
.ck{display:flex;gap:8px;align-items:flex-start;font-size:13px;color:var(--mut)}
#done{text-align:center;padding:24px 0}#done h2{margin:0 0 10px}
</style></head><body><main>
<h1>¡Reaccioná en vivo!</h1>
<div id="sc" hidden>Escaneá el QR de la pantalla para reaccionar 📷</div>
<div id="off" hidden>Esto no está activo ahora. ¡Volvé a probar más tarde!</div>
<div id="app" hidden>
<div id="f">
<div class="q">1. Elegí tu reacción</div><div class="g" id="g"></div>
<div id="pickw"><div class="q">2. Sumá tu foto <small>(opcional)</small></div>
<img id="prev" alt="Vista previa"><div class="err" id="ferr" role="alert"></div>
<input type="file" id="file" class="sr" accept="image/*" capture="user"><label for="file" id="pick"><svg viewBox="0 0 120 100" aria-hidden="true"><rect class="a" x="38" y="12" width="44" height="18" rx="6"/><rect class="a" x="8" y="24" width="104" height="68" rx="14"/><circle class="b" cx="60" cy="58" r="27"/><circle class="m" cx="60" cy="58" r="13"/><circle class="o" cx="98" cy="36" r="4.5"/></svg><span id="pickt">Tocá para sacarte la foto</span></label>
<button class="ghost" id="rm" hidden>Quitar foto</button></div>
<label class="ck"><input type="checkbox" id="ck"> Soy mayor de 18 años y acepto que mi reacción —y mi foto, si la mando— se muestre unos segundos en la pantalla del boliche. La foto se borra apenas sale de la pantalla. No te pedimos nombre.</label>
<div class="err" id="err" role="alert"></div>
<button id="send" disabled>¡Reaccionar!</button>
</div>
<div id="done" hidden><h2>¡Gracias por tu reacción! 🙌</h2><div id="dt"></div></div>
</div>
</main>
<script src="cara.js"></script>
<script type="module">
import {auth,db,DEF,R,night,watchCfg,onAuthStateChanged,signInAnonymously,addDoc,setDoc,doc,collection,serverTimestamp} from './fb.js';
const $=s=>document.querySelector(s),LS=localStorage;
let cfg={...DEF},uid=null,ses=+LS.ses>Date.now(),sel=null,photoURL=null,faceOK=false,sent=false;
const nk=()=>'rx'+night(),US=()=>JSON.parse(LS[nk()]||'{"n":0,"p":0,"t":0}');
const chk=()=>{$('#send').disabled=!(sel&&$('#ck').checked&&(!photoURL||faceOK)&&!sent)};
function dropPhoto(){if(photoURL)URL.revokeObjectURL(photoURL);photoURL=null;faceOK=false;$('#prev').removeAttribute('src');$('#file').value='';$('#ferr').textContent='';$('#pickt').textContent='Tocá para sacarte la foto';$('#rm').hidden=true;chk()}
function view(){
  const off=!cfg.enabled;$('#off').hidden=!off;$('#sc').hidden=off||ses;$('#app').hidden=off||!ses;
  const u=US(),max=u.n>=cfg.sendsNight,fin=sent||max||Date.now()-u.t<cfg.cooldownSecs*1000;
  $('#f').hidden=fin;$('#done').hidden=!fin;
  $('#dt').textContent=max&&!sent?'Ya llegaste al máximo de reacciones de esta noche. ¡Gracias por sumarte!':'Es muy importante para nosotros. ¡Mirá la pantalla! 👀';
  const hp=!!cfg.photosPaused||u.p>=cfg.photosNight;$('#pickw').hidden=hp;if(hp&&photoURL)dropPhoto();
  chk();
}
R.forEach(([k,e])=>{const b=document.createElement('button');b.textContent=e;b.setAttribute('aria-label',k);b.setAttribute('aria-pressed','false');
  b.onclick=()=>{sel=k;[...$('#g').children].forEach(x=>x.setAttribute('aria-pressed',x===b));chk()};$('#g').append(b)});
$('#ck').onchange=chk;
watchCfg(c=>{cfg=c;view()});view();loadLM();
onAuthStateChanged(auth,async u=>{if(!u){signInAnonymously(auth);return}uid=u.uid;await join();view()});
async function join(){
  const m=location.hash.match(/t=(\w+)/);if(!m)return;
  try{await setDoc(doc(db,'ses',uid),{tk:m[1],ts:serverTimestamp()});LS.ses=Date.now()+29*6e4;ses=true}
  catch(e){if(!ses)$('#sc').textContent='Ese QR venció. Escaneá el que está ahora en la pantalla 📷'}
  history.replaceState(null,'',location.pathname);
}
function expired(){LS.ses=0;ses=false;sent=false;$('#sc').textContent='Se terminó tu sesión. Escaneá de nuevo el QR de la pantalla 📷';view()}
// cámara: igual que en Halloween
$('#file').onchange=e=>{
  const f=e.target.files[0];if(photoURL)URL.revokeObjectURL(photoURL);
  photoURL=f?URL.createObjectURL(f):null;faceOK=false;$('#ferr').textContent='';
  if(photoURL){$('#prev').src=photoURL;checkFace(photoURL)}else $('#prev').removeAttribute('src');$('#pickt').textContent=photoURL?'Sacar otra foto':'Tocá para sacarte la foto';$('#rm').hidden=!photoURL;chk();
};
async function checkFace(url){
  $('#ferr').textContent='Buscando tu cara…';
  const lm=await loadLM();
  if(!lm){faceOK=true;$('#ferr').textContent='';chk();return}
  try{const im=new Image();im.src=url;await im.decode();const n=lm.detect(im).faceLandmarks.length;if(url!==photoURL)return;faceOK=n>0;$('#ferr').textContent=n?'':'No te vemos la cara. Probá de frente y con más luz.'}catch(e){faceOK=true;$('#ferr').textContent=''}
  chk();
}
$('#rm').onclick=dropPhoto;
$('#send').onclick=async()=>{
  if(!sel||!$('#ck').checked)return;
  sent=true;$('#send').disabled=true;$('#err').textContent='';
  try{
    let img=null;
    if(photoURL){
      const im=new Image();im.src=photoURL;await im.decode();
      const s=Math.min(1,400/Math.max(im.naturalWidth,im.naturalHeight)),c=document.createElement('canvas');
      c.width=Math.round(im.naturalWidth*s);c.height=Math.round(im.naturalHeight*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);
      img=c.toDataURL('image/jpeg',.7);
    }
    const d={uid,ts:serverTimestamp(),r:sel};if(img){d.img=img;d.ph=true}
    await addDoc(collection(db,'rx'),d);
    const u=US();u.n++;u.t=Date.now();if(img)u.p++;LS[nk()]=JSON.stringify(u);
    dropPhoto();view();
  }catch(e){sent=false;if(e.code==='permission-denied')expired();else{$('#err').textContent='No pudimos enviarla. Probá de nuevo.';chk()}}
};
</script></body></html>
