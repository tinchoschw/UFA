<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TV reacciones</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&display=swap"><link rel="stylesheet" href="estilo.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
html,body{height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#10121e,#000);cursor:none}
#bg,#vid{position:fixed;inset:0;width:100%;height:100%;border:0;pointer-events:none}
#vid{object-fit:cover;background:#000}
#dim{position:fixed;inset:0;background:#000;opacity:0;z-index:1;pointer-events:none;transition:opacity .4s}
.fl{position:fixed;bottom:-12vh;pointer-events:none;z-index:3;animation:up var(--d) ease-in-out forwards}
@keyframes up{50%{transform:translate(var(--x),-60vh)}to{transform:translate(0,-125vh);opacity:.3}}
.fp{width:10vw}.fp img{width:100%;display:block;border-radius:.8vw;border:.25vw solid var(--pk);box-shadow:0 0 2vw var(--pk2)}
.fp span{position:absolute;top:-2vw;right:-1.6vw;font-size:4.2vw;line-height:1;filter:drop-shadow(0 0 .6vw #000)}
#qr{position:fixed;right:1.5vw;bottom:2vh;width:15vw;z-index:5;background:#fff;padding:.7vw;border-radius:1vw;border:.3vw solid var(--pk);text-align:center;color:#111}
#qr svg{width:100%;height:100%;display:block}#qrs{aspect-ratio:1}
#cap{font:700 1.2vw/1.2 system-ui,sans-serif;margin-top:.5vw}
body.off .fl,body.off #qr{display:none}
#s-pair{position:fixed;inset:0;z-index:20;background:var(--bg);display:flex;flex-direction:column;gap:2vh;align-items:center;justify-content:center;text-align:center;padding:4vw}#s-pair h1{font-size:4vw}#s-pair p{font-size:2vw;color:var(--mut);max-width:60vw;margin:0}
#pq{width:24vw;background:#fff;padding:1vw;border-radius:1vw}#pq svg{width:100%;height:auto;display:block}
</style></head><body>
<iframe id="bg" title="Visuales"></iframe><video id="vid" muted autoplay playsinline hidden></video><div id="dim"></div>
<div id="qr"><div id="qrs"></div><div id="cap"></div></div>
<div id="s-pair"><h1>Vincular esta TV</h1><div id="pq"></div><p>Escaneá este QR con tu celu (con el panel de admin abierto y logueado) y tocá “Vincular esta TV”.</p></div>
<script type="module">
import {auth,db,refs,DEF,R,night,watchCfg,onAuthStateChanged,signInAnonymously,onSnapshot,query,collection,where,Timestamp,deleteDoc,doc,setDoc,increment} from './fb.js';
const $=s=>document.querySelector(s),E=Object.fromEntries(R);
let cfg={...DEF},S={all:{},h:{}},waitQ=[],fl=new Map(),tkc='',started=false,uid=null,bgT=null,vids=[],vi=-1;
let PC=JSON.parse(localStorage.pc2||'{}');if(PC.n!==night())PC={n:night(),c:{}};
const pcSave=()=>localStorage.pc2=JSON.stringify(PC);
// tv.html?debug muestra en pantalla qué recibe y por qué descarta algo
const dbg=new URLSearchParams(location.search).has('debug');
function log(m){if(!dbg)return;let e=$('#dbg');if(!e){e=document.createElement('pre');e.id='dbg';e.style.cssText='position:fixed;left:1vw;top:1vh;z-index:30;margin:0;font:1.2vw/1.3 monospace;color:#0f0;background:#000b;padding:.5vw;max-width:60vw;white-space:pre-wrap';document.body.append(e)}e.textContent=(new Date().toLocaleTimeString()+' '+m+'\n'+e.textContent).slice(0,900)}
const del=id=>deleteDoc(doc(db,'rx',id)).catch(()=>{});
// vinculación por QR: la TV entra como anónima y el admin (desde el celu) autoriza su uid
onAuthStateChanged(auth,u=>{
  if(!u){signInAnonymously(auth);return}
  if(uid)return;uid=u.uid;
  try{const q=qrcode(0,'M');q.addData(new URL('admin.html',location.href).href+'#tv='+uid);q.make();$('#pq').innerHTML=q.createSvgTag({cellSize:4,margin:0})}catch(e){}
  onSnapshot(refs.tv,s=>{const ok=s.exists()&&s.data().uid===uid;if(ok&&!started){started=true;go()}else if(!ok&&started)location.reload();$('#s-pair').hidden=ok},()=>{});
});
function count(k){const h=String(new Date().getHours()).padStart(2,'0');S.all[k]=(S.all[k]||0)+1;const o=S.h[h]=S.h[h]||{};o[k]=(o[k]||0)+1}
async function flush(){
  if(!Object.keys(S.all).length)return;
  const o={all:{},h:{}};for(const k in S.all)o.all[k]=increment(S.all[k]);
  for(const h in S.h){o.h[h]={};for(const k in S.h[h])o.h[h][k]=increment(S.h[h][k])}
  S={all:{},h:{}};setDoc(doc(db,'stats',night()),o,{merge:true}).catch(()=>{});
}
const tk=()=>Array.from(crypto.getRandomValues(new Uint8Array(8)),b=>b.toString(16).padStart(2,'0')).join('');
async function rot(){
  const n=tk();
  try{await setDoc(refs.token,{cur:n,prev:tkc||n})}catch(e){return}
  tkc=n;
  try{const q=qrcode(0,'L');q.addData(new URL('celu.html',location.href).href+'#t='+n);q.make();$('#qrs').innerHTML=q.createSvgTag({cellSize:4,margin:0})}catch(e){}
}
// ---- fondo: una página (iframe) o una lista de videos (uno por línea; rutas relativas a esta carpeta, URLs o links de Drive)
const vidRe=/\.(mp4|webm|mov|m4v)(\?|#|$)/i,drv=/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?[^ ]*?id=)([\w-]+)/i;
function setBg(t){
  if(t===bgT)return;bgT=t;
  const L=t.split('\n').map(x=>x.trim()).filter(Boolean).map(x=>{try{const m=x.match(drv);return m?'https://drive.google.com/uc?export=download&id='+m[1]:new URL(x,location.href).href}catch(e){return ''}}).filter(Boolean);
  const f=$('#bg'),v=$('#vid'),page=L.length===1&&!vidRe.test(L[0])&&!/uc\?export=download/.test(L[0]);
  vids=page?[]:L;vi=-1;
  if(page){f.src=L[0];v.pause();v.removeAttribute('src');v.hidden=true}
  else{f.removeAttribute('src');v.hidden=!vids.length;if(vids.length)nextVid();else{v.pause();v.removeAttribute('src')}}
}
function nextVid(){
  if(!vids.length)return;vi=(vi+1)%vids.length;const v=$('#vid');
  if(v.getAttribute('src')!==vids[vi])v.src=vids[vi];else v.currentTime=0;
  const p=v.play();if(p&&p.catch)p.catch(()=>setTimeout(nextVid,3000));
}
$('#vid').onended=nextVid;$('#vid').onerror=()=>setTimeout(nextVid,2000);
// ---- flotantes
const rnd=(a,b)=>a+Math.random()*(b-a);
function spawn(e){
  if(document.querySelectorAll('.fl:not(.fp)').length>=cfg.maxEmojis)return;
  const s=document.createElement('span');s.className='fl';s.textContent=e;
  s.style.cssText='left:'+rnd(4,92)+'vw;font-size:'+rnd(4,7)+'vw;--d:'+rnd(4.5,7)+'s;--x:'+rnd(-6,6)+'vw';
  s.onanimationend=()=>s.remove();document.body.append(s);
}
function floatPhoto(p){
  const w=document.createElement('div'),i=new Image(),b=document.createElement('span');
  w.className='fl fp';i.src=p.img;i.alt='';b.textContent=E[p.r];w.append(i,b);
  w.style.cssText='left:'+rnd(4,84)+'vw;--d:'+cfg.photoSecs+'s;--x:'+rnd(-5,5)+'vw';
  w.onanimationend=()=>{w.remove();fl.delete(p.id);del(p.id);pump()};
  fl.set(p.id,w);document.body.append(w);count('foto');
}
function pump(){while(waitQ.length&&fl.size<cfg.maxPhotos)floatPhoto(waitQ.shift())}
function drop(id){waitQ=waitQ.filter(p=>p.id!==id);const w=fl.get(id);if(w){w.remove();fl.delete(id);pump()}}
function go(){
  log('TV v2 lista (esperando reacciones)');
  watchCfg(c=>{
    const was=cfg.enabled;cfg=c;document.body.classList.toggle('off',!c.enabled);$('#cap').textContent=c.titulo;setBg(c.bg||'');$('#dim').style.opacity=(c.dim||0)/100;
    if(!c.enabled||c.photosPaused){waitQ.forEach(p=>del(p.id));waitQ=[];fl.forEach((w,id)=>{w.remove();del(id)});fl.clear()}
    if(c.enabled&&!was)rot();
  });
  rot();setInterval(()=>cfg.enabled&&rot(),60000);setInterval(flush,10000);
  // cada envío es un documento: reacción y, si hay, foto. Sale en cuanto llega, en paralelo con los demás.
  onSnapshot(query(collection(db,'rx'),where('ts','>=',Timestamp.fromMillis(Date.now()-30000))),s=>s.docChanges().forEach(ch=>{try{
    const id=ch.doc.id;
    if(ch.type==='removed'){drop(id);return}
    if(ch.type!=='added')return;
    const d=ch.doc.data(),now=Date.now(),c=PC.c[d.uid]||{t:0,n:0,p:0};
    let img=d.img;log('recibido '+d.r+(img?' +foto':''));
    if(img&&(cfg.photosPaused||c.p>=cfg.photosNight)){img=null;del(id)}
    if(!cfg.enabled||!E[d.r]||c.n>=cfg.sendsNight||now-c.t<cfg.cooldownSecs*800){log('descartado (límite o apagado)');if(img)del(id);return}
    c.t=now;c.n++;if(img)c.p++;PC.c[d.uid]=c;pcSave();count(d.r);
    if(!img)spawn(E[d.r]);
    else if(fl.size<cfg.maxPhotos)floatPhoto({id,img,r:d.r});
    else if(waitQ.length<cfg.maxQueue)waitQ.push({id,img,r:d.r});
    else{del(id);spawn(E[d.r])}
  }catch(e){log('ERR '+e.message)}}),e=>log('ERROR rx: '+e.code));
}
</script></body></html>
